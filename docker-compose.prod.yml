services:
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
